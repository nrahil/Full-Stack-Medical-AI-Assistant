services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost:3000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploaded_files:/app/uploaded_files
      - backend_data:/app

  frontend:
    build:
      context: ./med-ai-frontend
      dockerfile: Dockerfile
    container_name: medical-ai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    env_file:
      - ./med-ai-frontend/.env
    depends_on:
      - backend

volumes:
  backend_data:
